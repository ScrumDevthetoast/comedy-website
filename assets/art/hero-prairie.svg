    <use href="#telephone-line"/>
  </svg>
  <svg class="mobile-line" x="52%" y="4%" width="47%" height="83%" viewBox="0 0 528 250" preserveAspectRatio="none">
    <use href="#telephone-line"/>
  </svg>


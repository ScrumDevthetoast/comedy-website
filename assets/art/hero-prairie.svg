<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" aria-labelledby="title desc" role="img">
  <title id="title">The long way home</title>
  <desc id="desc">A lone cactus and crooked telephone poles share a quiet desert ridge. Loose wires sag between the poles. A small animal with a cat head at either end stands on the horizon.</desc>
  <style>
    .mobile-line { display: none; }
    @media (max-width: 760px) {
      .desktop-line { display: none; }
      .mobile-line { display: inline; }
    }
  </style>
  <defs>
    <pattern id="dry-ink" width="211" height="83" patternUnits="userSpaceOnUse">
      <path d="m17 21 2-1m52 34 1 2m62-43 3 1m43 47 2-2m-72 12 1 1" fill="none" stroke="#eee5d2" stroke-width="1" opacity=".24"/>
    </pattern>
  </defs>

  <!-- Terrain and pole spacing adapt; the cactus and creature retain their proportions. -->
  <svg width="100%" height="100%" viewBox="0 0 1600 300" preserveAspectRatio="none">
    <path d="M0 224 82 221 156 208 213 204 290 188 342 190 401 180 442 184 508 202 571 203 629 194 675 200 751 195 817 212 884 214 966 197 1008 200 1088 185 1149 190 1226 210 1304 213 1386 199 1445 207 1518 202 1600 219V300H0Z" fill="#b3aa96" opacity=".62"/>

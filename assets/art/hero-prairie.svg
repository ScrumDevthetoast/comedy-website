    <path d="m256 109 25 1-.2 2.1-25-1Zm3-5 1.5.1-.3 9-1.5-.1Zm17 1 1.5.1-.3 9-1.5-.1Z"/>
    <path d="m134 153 1.8-.2 7 97-2 .1Z"/>
    <path d="m126 167 18-1 .1 1.8-18 1Zm2-4 1.2-.1.3 7-1.2.1Zm12-1 1.2-.1.3 7-1.2.1Z"/>
    <path d="m23 194 1.4.1-3 58-1.5-.1Z"/>
    <path d="m17 204 12 .5-.1 1.4-12-.5Zm1-3 1 .1-.2 5-1-.1Zm8 .3 1 .1-.2 5-1-.1Z"/>
